name: Publish

# Push a tag like v0.2.0 (matching `version` in pyproject.toml) on main to
# publish that version to PyPI.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match pyproject version $version"
            exit 1
          fi
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q
      - name: Build sdist + wheel (hatch-reflex-pyi generates the .pyi stubs)
        run: uv build
      - name: The wheel carries the typed stubs
        run: unzip -l dist/*.whl | grep -q 'reflex_jupyter_renderer_react/jupyter_renderer_react\.pyi$'
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: this repository, this workflow (publish.yml) and this
    # environment (pypi) are registered on PyPI, so no API token is needed.
    environment:
      name: pypi
      url: https://pypi.org/project/reflex-jupyter-renderer-react/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
